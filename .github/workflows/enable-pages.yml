name: Bật GitHub Pages (chạy một lần)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Bật Pages với nguồn là nhánh gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          CODE=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data-binary '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "POST /pages -> $CODE"; cat /tmp/out.json
          if [ "$CODE" = "409" ] || [ "$CODE" = "422" ]; then
            CODE=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              --data-binary '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "PUT /pages -> $CODE"; cat /tmp/out.json
          fi
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | tee /tmp/pages.json
          echo "URL:"; python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('html_url','(chưa có)'))"
