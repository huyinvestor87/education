name: Chẩn đoán cấu hình GitHub Pages

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra environment và quy tắc nhánh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}$1"; }
          echo "===== /pages"; api /pages
          echo "===== default_branch"; api "" | python3 -c "import sys,json;print(json.load(sys.stdin).get('default_branch'))"
          echo "===== /environments"; api /environments
          echo "===== deployment-branch-policies"; api /environments/github-pages/deployment-branch-policies
