name: Deploy trang web lên GitHub Pages

on:
  push:
    branches:
      - main
      - claude/math-learning-website-grade-6-bd10ph
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chống cache — gắn phiên bản (build id) vào js/css
        run: |
          BUILD_ID="${GITHUB_SHA::8}-$(date -u +%Y%m%d%H%M%S)"
          echo "Build id: $BUILD_ID"
          grep -rl "__BUILD_ID__" --include="*.html" --include="*.js" . | while read -r f; do
            sed -i "s/__BUILD_ID__/${BUILD_ID}/g" "$f"
          done
          grep -rn "?v=" index.html

      - name: Chuẩn bị thư mục xuất bản
        run: |
          rm -rf _site
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          touch _site/.nojekyll

      - name: Xuất bản lên nhánh gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site từ ${GITHUB_SHA::8}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Đã xuất bản. URL: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
