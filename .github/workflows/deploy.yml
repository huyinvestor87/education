name: Deploy trang web lên GitHub Pages

on:
  push:
    branches:
      - main
      - claude/math-learning-website-grade-6-bd10ph
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chống cache — gắn phiên bản (build id) vào js/css
        run: |
          BUILD_ID="${GITHUB_SHA::8}-$(date -u +%Y%m%d%H%M%S)"
          echo "Build id: $BUILD_ID"
          grep -rl "__BUILD_ID__" --include="*.html" --include="*.js" . | while read -r f; do
            sed -i "s/__BUILD_ID__/${BUILD_ID}/g" "$f"
          done
          grep -n "?v=" index.html

      - name: Chuẩn bị thư mục xuất bản
        run: |
          rm -rf _site
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          touch _site/.nojekyll

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: In URL
        run: |
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
